<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tindahan Burger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Tindahan ni Angel</h1>
    <img src="logo.png" alt="Tindahan ni Angel Logo" />
  </header>

  <nav>
    <div id="checkout-bar">
      <div class="checkout-content">
        <span id="item-count">0 items selected</span>
        <span id="total-price">$0.00</span>
        <button onclick="checkout()">Checkout</button>
      </div>
    </div>
    
    <div class="nav-buttons">
      <button onclick="filterCategory('Burgers')">Burgers</button>
      <button onclick="filterCategory('Drinks')">Drinks</button>
      <button onclick="filterCategory('Desserts')">Desserts</button>
      <button onclick="filterCategory('Meals')">Meals</button>
      <button onclick="filterCategory('Specials')">Specials</button>
      <button onclick="filterCategory('Sides')">Sides</button>
      <button onclick="viewReviews()">Reviews</button>
    </div>
  </nav>

  <main id="main-content">
    <div id="menu-items" class="menu-grid"></div>
    <div id="reviews-section" class="hidden">
      <h2>Customer Reviews</h2>
      <div id="reviews-list"></div>
      <button id="back-to-menu-btn" onclick="backToMenu()">Back to Menu</button>
      
      <h3>Leave a Review</h3>
      <form id="review-form">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required /><br />
        <label for="review">Review:</label>
        <textarea id="review" name="review" required></textarea><br />
        <button type="submit">Submit Review</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
